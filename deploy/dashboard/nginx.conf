server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  location = /health/live {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 200 '{"status":"ok"}';
  }

  location = /index.html {
    add_header Cache-Control "no-store" always;
  }

  # The connected dashboard uses the same-origin API path. Compose provides
  # the `service` upstream; a hosted ingress may route this path instead.
  location /api/ {
    set $openlearn_service http://service:3000;
    proxy_pass $openlearn_service;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
